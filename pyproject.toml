[build-system]
requires = ["hatchling>=1.32.0"]
build-backend = "hatchling.build"

[project]
name = "krossdb"
version = "0.1.0"
description = "Enterprise-grade, multi-database unified interface & repository pattern library for Python"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "NexusDB Maintainers" }]
keywords = [
    "database", "repository-pattern", "unit-of-work", "postgresql", "mysql",
    "sqlite", "mongodb", "qdrant", "vector-database", "async", "sqlalchemy",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

dependencies = [
    # Data validation / settings
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.15.0,<3.0",
    # Relational (async SQLAlchemy)
    "sqlalchemy[asyncio]>=2.0.52,<3.0",
    # Observability
    "structlog>=24.1",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.44.0",
    # Resilience
    "tenacity>=8.3",
    # CLI
    "typer>=0.27.2",
    "rich>=13.7",
    # Misc
    "anyio>=4.3",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29"]
mysql = ["asyncmy>=0.2.9"]
sqlite = ["aiosqlite>=0.20"]
mongodb = ["motor>=3.7.1", "pymongo>=4.7"]
vector = ["qdrant-client>=1.9"]
cache = ["redis[hiredis]>=8.1.0"]
otel-exporters = [
    "opentelemetry-exporter-otlp>=1.25",
    "opentelemetry-instrumentation-sqlalchemy>=0.65b0",
]
all = [
    "krossdb[postgres,mysql,sqlite,mongodb,vector,cache,otel-exporters]",
]
dev = [
    "krossdb[sqlite,mongodb,vector,cache]",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "pytest-cov>=5.0",
    "testcontainers[postgres,mongodb,qdrant]>=4.10",
    "mypy>=1.10",
    "types-PyYAML>=6.0.12.20260815",
    "ruff>=0.5",
    "faker>=40.38.0",
    "httpx>=0.28.1",
    "pre-commit>=3.7",
]

[project.scripts]
nexusdb = "nexusdb.cli.main:app"

[project.urls]
Homepage = "https://github.com/ayal408/nexusdb"
Repository = "https://github.com/ayal408/nexusdb"
Changelog = "https://github.com/ayal408/nexusdb/blob/main/CHANGELOG.md"
Issues = "https://github.com/ayal408/nexusdb/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/nexusdb"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config --cov=nexusdb --cov-report=term-missing:skip-covered"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: fast, isolated tests with mocked adapters",
    "integration: tests that spin up real services via Testcontainers",
    "slow: tests that take a long time to run",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:google.*",
]

[tool.coverage.run]
source = ["src/nexusdb"]
branch = true
omit = ["*/cli/*"]

[tool.coverage.report]
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM", "RUF"]
ignore = [
    "E501",
    "B008",  # typer.Option(...)/typer.Argument(...) as a default is the documented Typer idiom
    "B027",  # AbstractUnitOfWork._persist_events is an intentional no-op extension hook, not missed abstractness
    "RUF022",  # __all__ is intentionally grouped by topic (with comments), not alphabetized
]

[tool.ruff.lint.per-file-ignores]
"src/nexusdb/cli/commands/*.py" = ["ASYNC240"]  # CLI commands read small local config files synchronously by design

[tool.ruff.lint.isort]
known-first-party = ["nexusdb"]
